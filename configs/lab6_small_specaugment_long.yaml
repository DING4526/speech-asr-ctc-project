seed: 2026
output_dir: checkpoints/lab6_small_specaugment_long
vocab_path: data/lab6_small/vocab.txt

data:
  train_wav_scp: data/lab6_small/train/wav.scp
  train_text: data/lab6_small/train/pinyin
  dev_wav_scp: data/lab6_small/dev/wav.scp
  dev_text: data/lab6_small/dev/pinyin
  test_wav_scp: data/lab6_small/test/wav.scp
  test_text: data/lab6_small/test/pinyin

feature:
  sample_rate: 16000
  n_mels: 80
  n_fft: 400
  win_length: 400
  hop_length: 160
  f_min: 20
  f_max: 7600
  normalize: true

model:
  input_dim: 80
  d_model: 64
  nhead: 4
  num_layers: 2
  dim_feedforward: 256
  dropout: 0.0

train:
  device: auto
  epochs: 20
  batch_size: 4
  num_workers: 0
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip: 5.0
  log_interval: 20
  num_threads: 2
  use_specaugment: true
  time_mask_param: 16
  freq_mask_param: 8
  num_time_masks: 1
  num_freq_masks: 1
